<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume AI · offline CV tailoring</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><div class="bar"><span class="logo">Resume<span>AI</span></span><span class="hint">offline · rule-based · industry glossaries</span></div></header>
<main>
  <div class="cols">
    <div class="stack">
      <section class="card">
        <div class="card-h"><h2>1 · Your CV</h2><button class="btn quiet sm" id="sample" type="button">Load sample</button></div>
        <div class="card-b">
          <label class="drop" id="drop"><b>Choose a CV PDF</b> or drop it here
            <input type="file" id="file" accept="application/pdf,.pdf" hidden></label>
          <div class="hint" id="fileName"></div>
          <label class="l" for="cv">…or paste CV text</label>
          <textarea id="cv" rows="12"></textarea>
        </div>
      </section>
      <section class="card">
        <div class="card-h"><h2>2 · Job ad</h2></div>
        <div class="card-b">
          <textarea id="job" rows="10" placeholder="Paste the job description"></textarea>
          <div class="row">
            <label class="hint" for="industry">Glossary</label>
            <select id="industry"><option value="auto">Detect from job ad</option></select>
            <label class="hint" for="lang">Letter</label>
            <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
          </div>
          <div class="row"><button class="btn" id="run" type="button">Analyze</button><span class="status" id="status"></span></div>
        </div>
      </section>
    </div>
    <section class="card" id="results">
      <div class="tabs" role="tablist">
        <button data-t="match" aria-selected="true">Match</button>
        <button data-t="changes" aria-selected="false">Changes <span class="n" id="nSug">0</span></button>
        <button data-t="checks" aria-selected="false">Checks <span class="n" id="nChk">0</span></button>
        <button data-t="letter" aria-selected="false">Cover letter</button>
      </div>
      <div class="pane" id="pane"><div class="empty">Add a CV and a job ad, then click <b>Analyze</b>.</div></div>
    </section>
  </div>
</main>
<footer>Runs on your machine. Your CV is not sent anywhere.</footer>
<script src="/static/app.js"></script>
</body>
</html>
